---
esphome:
  name: esphome-${devicename}

# Enable logging
logger:
  # See https://esphome.io/components/logger/#log-levels
  # level: DEBUG # default
  # level: INFO # use for battery operated or timing critical devices
  # level: VERBOSE # use to understand problems?

network:
  enable_ipv6: true

wifi:
  # when updating from another name use the ip / hostname for connection
  #use_address: 192.168.178.666
  min_auth_mode: WPA2
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password

# Home Assistant → nope
# api:

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery_unique_id_generator: mac
  use_abbreviations: false
  topic_prefix: espHome-${devicename}
  log_topic:
    topic: espHome-${devicename}/debug
    retain: false

sensor:
  - platform: wifi_signal
    id: wifi_signal_db
    name: RSSI
    update_interval: 10s
    accuracy_decimals: 2
    filters:
      - lambda: if (x < 0.0) { return x; } else { return {}; }
